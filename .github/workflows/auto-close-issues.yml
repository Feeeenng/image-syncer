name: auto-close-success-issues

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00 运行
  workflow_dispatch:

jobs:
  close-stale-success-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled 'success' after 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'success';
            const DAYS = 7;
            const cutoff = new Date(Date.now() - DAYS * 24 * 60 * 60 * 1000);

            // 获取所有带 success 标签的 open issues
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });

            for (const issue of issues) {
              // 通过 timeline 找到 success 标签被添加的时间
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });

              // 找到最近一次添加 success 标签的事件
              const labeledEvents = events.filter(
                e => e.event === 'labeled' && e.label && e.label.name === LABEL
              );

              if (labeledEvents.length === 0) continue;

              const lastLabeled = new Date(labeledEvents[labeledEvents.length - 1].created_at);

              if (lastLabeled <= cutoff) {
                // 添加关闭评论
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `该 issue 已在同步成功后超过 ${DAYS} 天，自动关闭。`,
                });

                // 关闭 issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });

                console.log(`Closed issue #${issue.number}`);
              }
            }
